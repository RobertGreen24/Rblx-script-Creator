{% extends "base.html" %}

{% block title %}Not found - {{ app_name }}{% endblock %}

{% block content %}
<div class="empty" style="margin-top:40px">
  <div class="eyebrow">404</div>
  <h1>That page is not here</h1>
  <p>The link may be old, or the project you were looking at has been deleted.</p>
  <div class="btn-row" style="justify-content:center">
    <a class="btn btn-primary" href="{{ url_for('pages.builder') }}">Feature builder</a>
    <a class="btn" href="{{ url_for('pages.projects') }}">My projects</a>
    <a class="btn btn-ghost" href="{{ url_for('pages.home') }}">Home</a>
  </div>
</div>
{% endblock %}
